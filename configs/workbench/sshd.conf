# Drop-in for the workbench sshd (mounted at /etc/ssh/sshd_config.d/).
# Key-only auth for the single `agent` user; the gateway is the only client.
# 2222, not 22: with userns keep-id the container root can't bind privileged
# ports in the compose network namespace.
Port 2222
HostKey /etc/ssh/hostkeys/ssh_host_ed25519_key
# Pubkey is root-owned under /etc/ssh (mounted ro from configs/workbench/ssh)
# instead of ~agent/.ssh, so the agent itself can't add keys and StrictModes
# stays happy.
AuthorizedKeysFile /etc/ssh/authorized_keys/%u
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers agent
X11Forwarding no
# The gateway only runs commands (with ControlMaster multiplexing); no tunnels.
AllowTcpForwarding no
AllowAgentForwarding no
