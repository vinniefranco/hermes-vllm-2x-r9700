# Egress proxy for the Hermes agent: allow the public internet, deny the LAN.
#
# The stack runs on an internal:true podman network (no direct outbound), so the
# ONLY way out is through this proxy. Proxy-aware traffic (curl/pip/git-https and
# Hermes's web tools) reaches the internet; Squid resolves the destination and
# denies any RFC1918 / link-local / CGNAT / loopback address, so the agent cannot
# reach 192.168.x, the host, or cloud metadata even via a hostname that points
# there. Raw/non-proxied traffic (nmap, direct sockets) has no route and fails.

http_port 3128

# --- Private / internal destination ranges to block (checked after DNS resolve)
acl to_private dst 0.0.0.0/8
acl to_private dst 10.0.0.0/8
acl to_private dst 100.64.0.0/10       # CGNAT / Tailscale
acl to_private dst 127.0.0.0/8         # loopback
acl to_private dst 169.254.0.0/16      # link-local (host.containers.internal, cloud metadata)
acl to_private dst 172.16.0.0/12
acl to_private dst 192.168.0.0/16      # your LAN
acl to_private dst ::1/128
acl to_private dst fc00::/7            # ULA
acl to_private dst fe80::/10           # link-local v6

# --- Allowed ports (general web access = HTTP/HTTPS)
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# Order matters: deny unsafe ports and all private destinations before allowing.
# The dst ACL is evaluated against the resolved IP (v4 and v6 private ranges both
# listed above), so a hostname pointing at the LAN is denied too.
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny to_private
http_access allow all
http_access deny all

# This is a forwarding gateway, not a cache; don't store or leak anything.
cache deny all
via off
forwarded_for delete
httpd_suppress_version_string on
