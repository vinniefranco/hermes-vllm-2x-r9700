# vLLM (Qwen3.8-27B-FP8, 2x AMD R9700) + Hermes Agent: podman compose
#
# vLLM service runs the prebuilt vllm-radiance image
# (https://codeberg.org/StillDeadcode/vllm-radiance): a gfx1201-only vLLM with
# the RDNA4 patches and tuned kernels baked in. Tweakable state lives in host
# dirs: ./models (HF cache/weights), ./configs (env, chat templates, one
# runtime patch), ./radiance-cache (JIT/compile caches), ./hermes-data (Hermes
# config + state). Config changes need only a restart, never a rebuild. Setup
# steps are in the README. Alternate models are opt-in profiles; `./model use
# <name>` swaps them in (see below).

# ── vLLM base: how a model server runs on this host ───────────────────────
# Everything below is host/GPU plumbing (devices, env, caches, healthcheck).
# Model-specific bits live in each service's `command`. The default `vllm`
# service merges this anchor; to serve another model, add a service under
# `profiles:` that merges it too (see the "Alternate models" section further
# down and README "Switching models").
x-vllm-base: &vllm-base
  image: docker.io/stilldeadcode/vllm-radiance:0.9.3
  restart: unless-stopped
  # Runs as container root (no user:/userns_mode): AITER JIT-writes kernels
  # into site-packages at startup; a non-root user crash-loops with
  # `ModuleNotFoundError: aiter.ops.triton.unified_attention`. Rootless podman
  # maps container root to the host user, so ./models and ./radiance-cache
  # stay owned by the host user.
  devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
  group_add:
    - "video"
    - "105"                        # host render group gid (getent group render)
  cap_add:
    - SYS_PTRACE
    - SYS_NICE                     # radiance: scheduling for its P2P all-reduce; also enables --numa-bind
  security_opt:
    - label=disable                # SELinux: required for /dev/kfd + /dev/dri
    - seccomp=unconfined           # per upstream run instructions
  shm_size: 16g                    # vLLM TP=2 IPC message queues; vLLM's documented default (a tmpfs cap, not a RAM reservation)
  networks:
    - stack                        # intra-stack: caddy proxies to vllm:8180 here
    - egress                       # outbound internet for HuggingFace pulls/updates (trusted server)
  # Not published; Caddy proxies /v1/* here.
  expose:
    - "8180"
  env_file:
    - ./configs/env/radiance.env   # AITER routing + RADIANCE switches + cache dirs
  environment:
    HF_HOME: /models               # weights + tokenizer land in ./models; model arg resolves from this cache
    VLLM_NO_USAGE_STATS: "1"
  volumes:
    - ./models:/models
    - ./configs/chat-templates:/app/chat-templates:ro
    # JIT/compile caches (dirs set in radiance.env); warm starts skip the ~10 min JIT:
    - ./radiance-cache:/cache
    # Runtime patch overlay (version-locked to the image's vLLM v0.27.1;
    # re-verify the shipped file is still stock on image bumps). protocol.py:
    # tolerate `tools: []` + `tool_choice: "none"` from some clients (Hermes
    # sends this; upstream 400s on it).
    - ./configs/patches/protocol.py:/opt/vllm/lib/python3.12/site-packages/vllm/entrypoints/openai/chat_completion/protocol.py:ro
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8180/health"]
    interval: 30s
    timeout: 5s
    retries: 40
    start_period: 900s             # first start downloads weights + JIT-compiles kernels
services:
  # Default model: Qwen3.8-27B-FP8 on both cards. This is what Hermes/Honcho
  # use and what Caddy proxies as `vllm:8180`. Always on.
  vllm:
    <<: *vllm-base
    container_name: vllm
    # Image entrypoint wraps `vllm serve`; model is the positional arg.
    # Chat template: froggeric/Qwen-Fixed-Chat-Templates (Qwen3.5/3.6/3.8 fixes:
    # medium-reasoning default, think-level steering tags, fast mode, empty-think
    # dedup). Pairs with qwen3_xml parser per that repo's README. The older
    # known-good template remains at ./configs/chat-templates/qwen.jinja.
    #
    # Serving knobs per upstream's recommendations: kv fp8 (halves KV
    # bandwidth, doubles KV capacity; use bf16 if output quality ever looks
    # off), MTP depth 8 under the dynamic-draft controller (see radiance.env),
    # and --no-async-scheduling, which disable_padded_drafter_batch requires.
    command: >
      Qwen/Qwen3.8-27B-FP8
      --served-model-name qwen3.8-27b
      --chat-template /app/chat-templates/qwen3.8-fixed.jinja
      --limit-mm-per-prompt '{"image": 99, "audio": 0, "video": 0}'
      --enable-auto-tool-choice
      --tool-call-parser qwen3_xml
      --reasoning-parser qwen3
      --quantization fp8
      --kv-cache-dtype fp8
      --max-model-len 262144
      --max-num-batched-tokens 16384
      --enable-prefix-caching
      --mamba-cache-mode align
      --gpu-memory-utilization 0.93
      --max-num-seqs 8
      -tp 2
      --attention-backend ROCM_AITER_UNIFIED_ATTN
      --speculative-config '{"method": "mtp", "num_speculative_tokens": 2, "attention_backend": "ROCM_AITER_UNIFIED_ATTN", "disable_padded_drafter_batch": true}'
      --no-async-scheduling
      --host 0.0.0.0
      --port 8180

  # ── Alternate models (opt-in profiles) ────────────────────────────────────
  # Both cards are committed to `vllm`, so an alternate model REPLACES it;
  # `./model use <name>` does the swap (README "Switching models"). Each
  # alternate takes the `vllm` alias on the stack net so Caddy's /v1/* route
  # and every client URL keep working. To add one, merge *vllm-base:
  #
  #   vllm-foo:
  #     <<: *vllm-base
  #     container_name: vllm-foo
  #     profiles: ["foo"]
  #     networks:
  #       stack: { aliases: [vllm] }
  #       egress: {}
  #     command: >
  #       org/Model --served-model-name foo --host 0.0.0.0 --port 8180 -tp 2 ...

  # ParoQuant MXFP6 (W6A8): hugypufy/Swift-Qwen3.8-27B-PARO-MXFP6 (Swift fine-tune, not stock
  # Qwen) on the radiance image; patches + kernels applied at start by configs/paro/prelude.sh.
  # Submodule tracks hugypufy's fork until ggz14 merges the MXFP6 PR. ./setup-paro, then
  # `./model use paro`. README "ParoQuant MXFP6".
  vllm-paro:
    <<: *vllm-base
    container_name: vllm-paro
    profiles: ["paro"]
    networks:
      stack: { aliases: [vllm] }
      egress: {}
    env_file:
      - ./configs/env/paro.env    # upstream's PARO prod env; model/drafter dir names live here too
    volumes:
      - ./models:/models
      # Upstream sources (patches, kernels, template); pinned submodule.
      - ./build/radiance-vllm-mxfp4:/patches:ro
      - ./configs/paro/prelude.sh:/opt/paro-prelude.sh:ro
      # Patched libr4d built by ./setup-paro (the image's own NaNs this model's GDN layers).
      - ./radiance-cache/libr4d/b9e42ab-rx6:/r4d:ro
      # Own compile caches: keyed on model + kernel flags, never shared with ./radiance-cache.
      - ./radiance-cache/paro-mxfp6:/cache
      - ./configs/patches/protocol.py:/opt/vllm/lib/python3.12/site-packages/vllm/entrypoints/openai/chat_completion/protocol.py:ro
    entrypoint: ["bash", "/opt/paro-prelude.sh"]
    # Args after the model path (the prelude prepends /models/$PARO_MODEL_DIR). Serving
    # config is upstream MODE=prod: R4D attention, fp8 KV, DFlash2 drafter with 7 draft
    # tokens, 262k ctx, upstream's compilation-config. Tool/reasoning parsers as the
    # default service (verified with Hermes); template is upstream's froggeric v22.3 (the
    # one its GSM8K band was measured with; v22.1 is what the default service mounts).
    # KV pin is hugypufy's for this checkpoint on 2x R9700; it bypasses the util profile.
    command: >
      --served-model-name qwen3.8-27b swift-qwen3.8-27b-paro-mxfp6
      --chat-template /patches/qwen-fixed-v22.3.jinja
      --limit-mm-per-prompt '{"image": 99, "audio": 0, "video": 0}'
      --enable-auto-tool-choice
      --tool-call-parser qwen3_xml
      --reasoning-parser qwen3
      --kv-cache-dtype fp8
      --max-model-len 262144
      --max-num-batched-tokens 8192
      --max-num-seqs 8
      --enable-prefix-caching
      --mamba-cache-mode align
      --gpu-memory-utilization 0.92
      --kv-cache-memory-bytes 13500000000
      -tp 2
      --attention-backend R4D
      --speculative-config '{"method": "dflash", "model": "/models/Qwen3.8-27B-DFlash2-FP8", "num_speculative_tokens": 7, "attention_backend": "TRITON_ATTN", "disable_padded_drafter_batch": true, "draft_sample_method": "greedy"}'
      --no-async-scheduling
      --compilation-config '{"pass_config": {"fuse_norm_quant": true, "fuse_act_quant": true}, "compile_sizes": [1, 2, 4, 8], "inductor_compile_config": {"enable_auto_functionalized_v2": false, "size_asserts": false, "alignment_asserts": false, "scalar_asserts": false, "combo_kernels": true, "benchmark_combo_kernel": true, "triton.cooperative_reductions": true}}'
      --host 0.0.0.0
      --port 8180

  # TLS termination. Hostnames + routing live in configs/caddy/conf/Caddyfile;
  # client trust setup and the port-443 sysctl are in the README.
  caddy:
    image: docker.io/library/caddy:2
    container_name: caddy
    restart: unless-stopped
    networks:
      - stack                        # internal-only; internal CA needs no egress, inbound publish still works
    ports:
      - "443:443"                    # everything, path-routed (see Caddyfile)
      - "9119:9119"                  # TLS for Hermes Desktop's Remote Gateway
    volumes:
      # Directory (not file) mount so edits + `podman exec caddy caddy reload
      # --config /etc/caddy/Caddyfile` work live (file mounts pin the old inode
      # when an editor replaces the file):
      - ./configs/caddy/conf:/etc/caddy:ro,Z
      - ./configs/caddy/data:/data:Z
      - ./configs/caddy/config:/config:Z

  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    # rootless podman: map container uid/gid 10000 (the hermes-agent user) to the
    # host user, so hermes-data/ and projects/ stay owned by vinnie on the host:
    # no `podman unshare` needed to read agent output, and host agents
    # (claude/omp) can collaborate on the same files.
    userns_mode: "keep-id:uid=10000,gid=10000"
    depends_on:
      workbench:
        condition: service_healthy    # agent shells run there (terminal.backend: ssh)
    # Bundled Chromium needs ~1g shm (podman's 64M default crashes it); the
    # memory cap keeps a runaway agent/browser from squeezing vLLM on this
    # 30 GB host.
    shm_size: 1g
    mem_limit: 4g
    environment:
      HERMES_DASHBOARD: "1"
      # File-tool writes: the workspace (same path in the workbench) and the
      # plugin staging dir (README "Agent-authored plugins"). Memories, skills
      # and cron have their own tools and don't go through this.
      HERMES_WRITE_SAFE_ROOT: /projects:/opt/data/plugins-dev
      API_SERVER_ENABLED: "true"   # OpenAI-compatible gateway on :8642 (proxied at https://.../hermes/v1)
      API_SERVER_HOST: 0.0.0.0
      # Bearer key: API_SERVER_KEY in hermes-data/.env (auto-generated; that
      # file wins over env set here).
      #
      # `stack` is internal-only, so all internet access goes via squid.
      # NO_PROXY must list every in-cluster hostname this container talks to,
      # or squid denies the 10.x address as private (README gotchas).
      HTTP_PROXY: http://squid:3128
      HTTPS_PROXY: http://squid:3128
      http_proxy: http://squid:3128
      https_proxy: http://squid:3128
      NO_PROXY: vllm,caddy,hermes,honcho,workbench,localhost,127.0.0.1,::1,.dns.podman
      no_proxy: vllm,caddy,hermes,honcho,workbench,localhost,127.0.0.1,::1,.dns.podman
      # Dashboard file API root. Upstream's only knob and it takes one root;
      # anything narrower 403s artifact opens under /projects and /home/agent.
      # ~/… artifact rows still 404 (gateway expands ~ to /opt/data); use
      # their /home/agent/… twins.
      HERMES_DASHBOARD_FILES_ROOT: /
    networks:
      - stack
    volumes:
      # :z (shared label) on everything the workbench also mounts; :Z would
      # relabel the dir away from the other container on every restart.
      - ./hermes-data:/opt/data:z
      - ./projects:/projects:z
      # Read-only view of the agent's workbench home so the dashboard can
      # serve /home/agent/… files the agent wrote via its shell.
      - ./workbench-home:/home/agent:ro,z
    # Not published; Caddy proxies both.
    expose:
      - "8642"
      - "9119"

  # ── Workbench: the agent's terminal sandbox ───────────────────────────────
  # Every agent shell command runs here over SSH (terminal.backend: ssh), not
  # in the hermes container, so the gateway's secrets in /opt/data stay out
  # of shell reach. What's shared and why: README "Using it". Key-only auth
  # as `agent` (uid 10000); keypair setup is README step 1.
  workbench:
    image: localhost/hermes-workbench:latest
    build:
      context: ./build/workbench
      dockerfile: Containerfile
    container_name: workbench
    restart: unless-stopped
    # Same keep-id mapping as hermes: `agent` (10000) == host vinnie.
    userns_mode: "keep-id:uid=10000,gid=10000"
    # Cap agent builds/tests so a runaway compile can't OOM-pressure vLLM.
    mem_limit: 4g
    networks:
      - stack
    # Reachable only in-cluster (the gateway's SSH client); nothing published.
    expose:
      - "2222"
    volumes:
      - ./projects:/projects:z                                             # shared with hermes (see its mount)
      # Slices of the agent's home, not all of hermes-data (secrets stay
      # unmounted). plugins/ is :ro because the gateway imports it into its
      # own process; the multica-pm CLI only reads it.
      - ./hermes-data/plugins:/opt/data/plugins:ro,z
      - ./hermes-data/skills:/opt/data/skills:ro,z
      - ./hermes-data/memories:/opt/data/memories:ro,z
      # Plugin staging (README "Agent-authored plugins"); Hermes never loads it.
      - ./hermes-data/plugins-dev:/opt/data/plugins-dev:z
      # Artifact hub (bare git repos) at the same absolute path as on the host
      # and in Mika sandboxes, so recorded repo paths + SHAs work everywhere
      # (convention: ~/agents/HANDOFF.md).
      - /home/vinnie/agents/repos:/home/vinnie/agents/repos:z
      # Persistent agent HOME: synced skills, pip/npm/uv caches, venvs. Without
      # it all of that is wiped on every recreate.
      - ./workbench-home:/home/agent:z
      - ./configs/workbench/ssh/hostkeys:/etc/ssh/hostkeys:Z               # persistent sshd identity across rebuilds
      - ./configs/workbench/ssh/authorized_keys:/etc/ssh/authorized_keys/agent:ro,Z
      - ./configs/workbench/sshd.conf:/etc/ssh/sshd_config.d/workbench.conf:ro,Z
      - ./configs/workbench/environment:/etc/environment:ro,Z              # PAM injects proxy env into SSH sessions
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/2222"]
      interval: 10s
      timeout: 5s
      retries: 6

  # ── Honcho (self-hosted memory for Hermes) ────────────────────────────────
  # https://github.com/plastic-labs/honcho, reached via Hermes's built-in
  # honcho memory plugin (README step 4). All LLM calls go to the local vLLM
  # (configs/env/honcho.common); secrets in honcho-data/.env.

  honcho-db:
    image: docker.io/pgvector/pgvector:pg17
    container_name: honcho-db
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=200"]
    env_file:
      - ./honcho-data/.env             # POSTGRES_DB/USER/PASSWORD (extra vars harmless)
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    networks:
      - stack
    expose:
      - "5432"
    volumes:
      - ./honcho-data/db:/var/lib/postgresql/data:Z
      - ./configs/honcho/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honcho -d honcho"]
      interval: 5s
      timeout: 5s
      retries: 10

  # OpenAI-compatible /v1/embeddings for Honcho (both GPUs are fully committed
  # to vLLM, so embeddings run on CPU). Dual-homed on `egress` like vllm for the
  # one-time HF model download; weights cached in ./models/tei.
  honcho-embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    container_name: honcho-embeddings
    restart: unless-stopped
    # max-batch-tokens 4096 also caps the warmup sequence; at the model's
    # native 32k context the warmup attention spike OOMs this container.
    command: ["--model-id", "Qwen/Qwen3-Embedding-0.6B", "--auto-truncate", "--max-batch-tokens", "4096"]
    networks:
      - stack
      - egress
    expose:
      - "80"
    volumes:
      - ./models/tei:/data:Z

  honcho:
    image: ghcr.io/plastic-labs/honcho:latest
    container_name: honcho
    restart: unless-stopped
    # Prebuilt image has no entrypoint (bare `fastapi run`); the repo's
    # entrypoint script runs DB migrations first, so invoke it explicitly.
    entrypoint: ["sh", "docker/entrypoint.sh"]
    depends_on:
      honcho-db:
        condition: service_healthy
    env_file:
      - ./configs/env/honcho.common    # model routing → vllm, embeddings, feature flags
      - ./honcho-data/.env             # DB_CONNECTION_URI (holds the password)
    environment:
      # Outbound (tiktoken's one-time BPE download) via squid; NO_PROXY as for hermes.
      HTTP_PROXY: http://squid:3128
      HTTPS_PROXY: http://squid:3128
      http_proxy: http://squid:3128
      https_proxy: http://squid:3128
      NO_PROXY: vllm,honcho,honcho-db,honcho-embeddings,localhost,127.0.0.1,::1,.dns.podman
      no_proxy: vllm,honcho,honcho-db,honcho-embeddings,localhost,127.0.0.1,::1,.dns.podman
    networks:
      - stack
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Background deriver worker: same image/env as the API, different entrypoint.
  honcho-deriver:
    image: ghcr.io/plastic-labs/honcho:latest
    container_name: honcho-deriver
    restart: unless-stopped
    entrypoint: ["/app/.venv/bin/python", "-m", "src.deriver"]
    depends_on:
      honcho:
        condition: service_healthy     # api runs migrations; deriver must start after
      honcho-db:
        condition: service_healthy
    env_file:
      - ./configs/env/honcho.common
      - ./honcho-data/.env
    environment:
      HTTP_PROXY: http://squid:3128
      HTTPS_PROXY: http://squid:3128
      http_proxy: http://squid:3128
      https_proxy: http://squid:3128
      NO_PROXY: vllm,honcho,honcho-db,honcho-embeddings,localhost,127.0.0.1,::1,.dns.podman
      no_proxy: vllm,honcho,honcho-db,honcho-embeddings,localhost,127.0.0.1,::1,.dns.podman
    networks:
      - stack

  # Egress proxy: the only path from the internal `stack` net to the internet.
  # Allows public HTTP/HTTPS, denies all private ranges (see configs/squid/squid.conf).
  # Dual-homed: `stack` (clients reach it) + `egress` (it reaches the internet).
  squid:
    image: docker.io/ubuntu/squid:latest
    container_name: squid
    restart: unless-stopped
    volumes:
      - ./configs/squid/squid.conf:/etc/squid/squid.conf:ro,Z
    networks:
      - stack
      - egress

networks:
  stack:
    driver: bridge
    internal: true                   # no direct outbound for any stack service
  egress:
    driver: bridge                   # normal network with internet: squid (agent's proxied egress) + vllm (HF pulls)
