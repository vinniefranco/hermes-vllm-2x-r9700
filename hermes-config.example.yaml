# Seed configuration for Hermes Agent: copy to hermes-data/config.yaml per the
# README setup steps. The real file is gitignored because it holds secrets.
# Hermes normalizes/extends it on first run (adds _config_version,
# custom_providers).

# Model backend = the local vLLM container. api_key must be a NON-EMPTY dummy
# (vLLM ignores it); do NOT use "none", because Hermes reads that as "no key" and the
# desktop app fails credential resolution.
model:
  provider: custom
  base_url: http://vllm:8180/v1
  api_key: "sk-local-vllm"
  default: qwen3.8-27b

custom_providers:
  - name: vllm
    base_url: http://vllm:8180/v1
    model: qwen3.8-27b
    models:
      - qwen3.8-27b

# Agent shells run on the `workbench` sidecar over SSH, NOT inside the hermes
# container, so the agent can't read /opt/data (gateway key, auth secrets,
# state). /projects is bind-mounted into both containers; the agent cannot
# reach the host. Port is 2222: with the keep-id userns, container root can't
# bind privileged ports. Keypair setup is in the README (gateway holds the
# private key, workbench the pubkey).
terminal:
  backend: ssh
  cwd: /projects
  ssh_host: workbench
  ssh_user: agent
  ssh_port: 2222
  # NB: the config key this image reads is `ssh_key` (bridged to TERMINAL_SSH_KEY);
  # the upstream docs show `ssh_key_path`, which this image does NOT recognize.
  # Re-check on image upgrades.
  ssh_key: /opt/data/workbench-ssh/id_ed25519

# Unattended gateway: hard-stop runaway tool loops instead of only warning.
tool_loop_guardrails:
  hard_stop_enabled: true
  hard_stop_after:
    exact_failure: 5
    idempotent_no_progress: 5

# Dashboard / desktop-app login. FILL THESE IN before use; the commands to
# generate both values are in the README. The secret is required: without it,
# every restart invalidates all logins with session_expired.
dashboard:
  basic_auth:
    username: vinnie
    password_hash: "REPLACE_WITH_SCRYPT_HASH"
    secret: "REPLACE_WITH_openssl_rand_hex_32"
