# Seed configuration for Hermes Agent — copy to hermes-data/config.yaml on first
# setup (the real file is gitignored because it holds secrets). Hermes will
# normalize/extend this on first run (adds _config_version, custom_providers).
#
#   mkdir -p hermes-data
#   cp hermes-config.example.yaml hermes-data/config.yaml
#   # then set a dashboard password + a session secret (see below)

# Model backend = the local vLLM container. api_key must be a NON-EMPTY dummy
# (vLLM ignores it); do NOT use "none" — Hermes reads that as "no key" and the
# desktop app fails credential resolution.
model:
  provider: custom
  base_url: http://vllm:8180/v1
  api_key: "sk-local-vllm"
  default: qwen3.8-27b

custom_providers:
  - name: vllm
    base_url: http://vllm:8180/v1
    model: qwen3.8-27b
    models:
      - qwen3.8-27b

# Agent shells run on the `workbench` sidecar over SSH, NOT inside the hermes
# container — so the agent can't read /opt/data (gateway key, auth secrets,
# state). /projects is bind-mounted into both containers; the agent cannot
# reach the host. Keypair setup (once, before first start):
#   podman unshare sh -c 'd=hermes-data/workbench-ssh; mkdir -p $d && \
#     ssh-keygen -t ed25519 -N "" -f $d/id_ed25519 && chown -R 10000:10000 $d'
#   mkdir -p configs/workbench/ssh/hostkeys
#   podman unshare cat hermes-data/workbench-ssh/id_ed25519.pub > configs/workbench/ssh/authorized_keys
terminal:
  backend: ssh
  cwd: /projects
  ssh_host: workbench
  ssh_user: agent
  ssh_port: 22
  # NB: the config key this image reads is `ssh_key` (bridged to TERMINAL_SSH_KEY);
  # the upstream docs show `ssh_key_path`, which this image does NOT recognize.
  # Re-check on image upgrades.
  ssh_key: /opt/data/workbench-ssh/id_ed25519

# Unattended gateway: hard-stop runaway tool loops instead of only warning
# (upstream docker-guide recommendation for headless deployments).
tool_loop_guardrails:
  hard_stop_enabled: true
  hard_stop_after:
    exact_failure: 5
    idempotent_no_progress: 5

# Dashboard / desktop-app login. FILL THESE IN before use:
#   password_hash: podman run --rm --entrypoint python nousresearch/hermes-agent \
#                    -c "from plugins.dashboard_auth.basic import hash_password; print(hash_password('YOUR-PASSWORD'))"
#   secret:        openssl rand -hex 32   (REQUIRED — without it, every restart
#                  invalidates all logins with session_expired)
dashboard:
  basic_auth:
    username: vinnie
    password_hash: "REPLACE_WITH_SCRYPT_HASH"
    secret: "REPLACE_WITH_openssl_rand_hex_32"
